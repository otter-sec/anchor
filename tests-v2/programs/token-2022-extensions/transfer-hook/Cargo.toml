[package]
name = "token-2022-ext-transfer-hook"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "token_2022_ext_transfer_hook"

[features]
default = ["no-log-ix-name"]
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { path = "../../../../lang-v2", default-features = false, features = ["alloc"] }
anchor-spl = { path = "../../../../spl-v2", features = ["guardrails"] }
solana-program-error = "3.0"

[lints.rust.unexpected_cfgs]
level = "allow"
