[package]
name = "account-address-constraints"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "account_address_constraints"

[features]
default = ["no-log-ix-name"]
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
idl-build = []

[dependencies]
anchor-lang = { path = "../../../lang-v2", default-features = false, features = ["alloc"] }
anchor-spl = { path = "../../../spl-v2", features = ["guardrails"] }
bytemuck = { version = "1", features = ["derive"] }
pinocchio = { version = "0.11", default-features = false, features = ["copy"] }
pinocchio-system = "0.6"
solana-program-error = "3.0"

[lints.rust.unexpected_cfgs]
level = "allow"
