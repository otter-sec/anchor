[package]
name = "equivalence-spl-v1"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "equivalence_spl_v1"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { package = "anchor-lang-v1", path = "../../../../../lang" }
anchor-spl = { package = "anchor-spl-v1", path = "../../../../../spl", default-features = false, features = ["token", "token_2022"] }

