[package]
name = "optional-callee"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["no-log-ix-name"]
no-entrypoint = []
cpi = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { path = "../../../../../../lang-v2", default-features = false, features = ["alloc"] }

[lints.rust.unexpected_cfgs]
level = "allow"
