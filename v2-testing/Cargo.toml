[package]
name = "anchor-v2-testing"
version = "0.1.0"
edition = "2021"
description = "Host-side test utilities for Anchor v2 programs: in-process SVM setup with per-test SBF register-trace capture for `anchor test --profile`."
license = "Apache-2.0"
publish = false

[features]
default = []
register-tracing = ["litesvm/register-tracing"]

# Runtime PC tracing for per-test flamegraphs. Activates litesvm's
# register-tracing feature and installs a callback that keys trace files
# by test name. No-op when disabled — `svm()` reduces to `LiteSVM::new()`.
profile = [
    "dep:solana-program-runtime",
    "dep:solana-transaction-context",
    "register-tracing",
    # Activates sbpf's gdb-stub through LiteSVM. When
    # `VM_DEBUG_PORT` is set in env, every `EbpfVm::new` blocks on that
    # port waiting for a client — this is what `anchor debugger --gdb`
    # drives. No-op unless the env var is set.
    "litesvm/sbpf-debugger",
]

[dependencies]
litesvm.workspace = true
# Re-exported so scaffold tests import `Keypair` / `Signer` / `Message` / ...
# via `anchor_v2_testing` and don't need direct deps on each.
solana-keypair.workspace = true
solana-message.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
# Match the Agave runtime API used by LiteSVM's callbacks.
solana-program-runtime = { workspace = true, optional = true }
solana-transaction-context = { workspace = true, optional = true }
