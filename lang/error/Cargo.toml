[package]
name = "anchor-lang-error"
version.workspace = true
publish = true
edition = "2021"
repository.workspace = true
license = "Apache-2.0"
description = "Error definitions for anchor-lang"

[package.metadata.docs.rs]
# Not `workspace = true`: `all-features` would enable both `solana-v3` and `solana-v4`.
# The defaults (`borsh` + `solana-v3`) are what we want documented.
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `solana-v3`/`solana-v4` mirror anchor-lang's Solana cohort selection; exactly one must be
# active. anchor-lang passes its own choice through to this crate.
default = ["borsh", "solana-v3"]
borsh = ["dep:borsh", "solana-program-error/borsh"]
solana-v3 = ["dep:solana-pubkey-v3"]
solana-v4 = ["dep:solana-pubkey-v4"]

[dependencies]
anchor-attribute-error = { workspace = true }

borsh = { version = "1.5.7", optional = true }

solana-msg.workspace = true
solana-program-error = { workspace = true }

# Cohort-specific; see `[features]` above.
solana-pubkey-v3 = { workspace = true, optional = true }
solana-pubkey-v4 = { workspace = true, optional = true }
