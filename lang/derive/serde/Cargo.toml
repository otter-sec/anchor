[package]
name = "anchor-derive-serde"
version.workspace = true
publish = true
repository.workspace = true
license = "Apache-2.0"
description = "Anchor Derive macro for serialization and deserialization"
edition = "2021"

[package.metadata.docs.rs]
workspace = true

[lib]
proc-macro = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[features]
# Mirrors anchor-lang's Solana cohort selection, for the doc-test dev-dependency
# above. anchor-lang depends on this crate with `default-features = false`, so
# this default does not feed back into anchor-lang's own cohort.
default = ["solana-v3"]
solana-v3 = ["anchor-lang/solana-v3"]
solana-v4 = ["anchor-lang/solana-v4"]
idl-build = ["anchor-syn/idl-build"]
lazy-account = ["anchor-lang/lazy-account"]

[dependencies]
anchor-syn = { workspace = true, optional = true }
proc-macro-crate = "3.4.0"
proc-macro2 = "1"
quote = "1"
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
# Serialization macros require `anchor-lang` to be available to locate `borsh`
# This is required for doc testing.
#
# `default-features = false` matters: anchor-lang's default enables the `solana-v3`
# Solana cohort, and Cargo unifies features across the graph, so inheriting it
# here would force `solana-v3` on even in a `--features solana-v4` build. The cohort comes
# from this crate's own `solana-v3`/`solana-v4` features instead.
anchor-lang = { path = "../../", default-features = false }
