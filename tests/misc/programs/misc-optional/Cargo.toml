[package]
name = "misc-optional"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "misc_optional"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { package = "anchor-lang-v1", path = "../../../../lang", features = ["init-if-needed"] }
anchor-spl = { package = "anchor-spl-v1", path = "../../../../spl" }
bytemuck = { version = "1.4.0", features = ["derive", "min_const_generics"] }
