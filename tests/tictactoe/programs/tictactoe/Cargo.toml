[package]
name = "tictactoe"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tictactoe"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { package = "anchor-lang-v1", path = "../../../../lang" }
anchor-spl = { package = "anchor-spl-v1", path = "../../../../spl" }
