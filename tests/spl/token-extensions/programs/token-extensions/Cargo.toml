[package]
name = "token-extensions"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_extensions"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { path = "../../../../../lang", features = ["init-if-needed"] }
anchor-spl = { path = "../../../../../spl" }
spl-tlv-account-resolution = "0.10.0"
spl-transfer-hook-interface = "0.10.0"
spl-type-length-value = "0.9"
spl-pod = "0.7"
# spl-token-2022's extension "optional pubkey" fields (metadata pointer,
# transfer hook, permanent delegate, close authority, ...) encode as
# `MaybeNull<Pubkey>`, not `spl-pod`'s `OptionalNonZeroPubkey`.
solana-nullable = "1"
