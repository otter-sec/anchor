[package]
name = "anchor-bench"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["bin"]
bin = []

[dependencies]
anchor-v2-testing = { path = "../v2-testing" }
anyhow = "1.0"
anchor-lang-v1 = { path = "../lang" }
anchor-lang = { path = "../lang-v2" }
hello-world = { path = "programs/helloworld/anchor-v1", features = ["no-entrypoint"] }
hello-world-v2 = { path = "programs/helloworld/anchor-v2", features = ["cpi"], package = "hello-world-v2" }
solana-account = "4.5.0"
solana-compute-budget = "4.3.0"
solana-rent = "4.4.0"
multisig-v1 = { path = "programs/multisig/anchor-v1", features = ["no-entrypoint"], package = "multisig-v1" }
multisig-v2 = { path = "programs/multisig/anchor-v2", features = ["cpi"], package = "multisig-v2" }
vault-v1 = { path = "programs/vault/anchor-v1", features = ["no-entrypoint"], package = "vault-v1" }
vault-v2 = { path = "programs/vault/anchor-v2", features = ["cpi"], package = "vault-v2" }
prop-amm-v1 = { path = "programs/prop-amm/anchor-v1", features = ["no-entrypoint"], package = "prop-amm-v1" }
prop-amm-v2 = { path = "programs/prop-amm/anchor-v2", features = ["cpi"], package = "prop-amm-v2" }
nested-v1 = { path = "programs/nested/anchor-v1", features = ["no-entrypoint"], package = "nested-v1" }
nested-v2 = { path = "programs/nested/anchor-v2", features = ["cpi"], package = "nested-v2" }
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-keypair = "3.1.2"
solana-message = "4.5.0"
solana-pubkey = "4.3.0"
solana-signer = "3.0.1"
solana-transaction = "4.2.0"
plotters = "0.3.7"

[workspace]
exclude = [
    "programs/vault/quasar",
    "programs/vault/pinocchio",
    "programs/vault/steel",
]

[profile.release]
overflow-checks = false
lto = "fat"
codegen-units = 1
opt-level = 3
[profile.release.build-override]
opt-level = 3
codegen-units = 1
