name: Semver Checks

on:
  pull_request:
    branches:
      - master
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.rs"

permissions:
  contents: read

jobs:
  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache cargo registry and builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-semver-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-semver-

      - name: Check semver compatibility
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          # Anchor's macro crates are internal codegen plumbing, not public API.
          # Only `anchor-syn` is checked today, as semver-checks skips `proc-macro` crates.
          exclude: >-
            avm,
            anchor-cli,
            anchor-syn,
            anchor-attribute-access-control,
            anchor-attribute-account,
            anchor-attribute-constant,
            anchor-attribute-error,
            anchor-attribute-event,
            anchor-attribute-program,
            anchor-derive-accounts,
            anchor-derive-serde,
            anchor-derive-space,
            anchor-cli-macros
          baseline-rev: ${{ github.event.pull_request.base.sha }}
