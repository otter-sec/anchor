name: Template Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      # Docs/changelog cannot affect these tests.
      - "docs/**"
      - "docs-v2/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".cspell-anchor-dictionary.txt"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-v2/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".cspell-anchor-dictionary.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLANA_VERSION: "4.1.2"
  SBF_TOOLS_VERSION: "v1.57"
  NODE_VERSION: "20"
  SURFPOOL_CLI_VERSION: "1.5.0"

jobs:
  # Build CLI once to share across test jobs
  build-cli:
    name: Build CLI
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-bump/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      rust-version: ${{ steps.rustc.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup/
      - uses: ./.github/actions/setup-solana/
        if: github.event_name != 'pull_request'
      - uses: ./.github/actions/setup-surfpool/
        if: github.event_name != 'pull_request'
      - uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        name: Warm SBF platform tools
        if: github.event_name != 'pull_request'
        with:
          retry_wait_seconds: 60
          timeout_minutes: 5
          max_attempts: 5
          retry_on: error
          shell: bash
          command: cargo build-sbf --tools-version "${{ env.SBF_TOOLS_VERSION }}" --install-only
      - name: Identify Rust compiler
        id: rustc
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-cargo-cache/

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        name: Restore CLI target
        id: cli-target
        with:
          path: ./target/
          key: cargo-target-template-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-target-template-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.version }}-

      - run: cargo install --path cli --locked --debug --force --target-dir ./target

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        name: Save CLI target
        if: github.event_name != 'pull_request' && steps.cli-target.outputs.cache-hit != 'true'
        with:
          path: ./target/
          key: ${{ steps.cli-target.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anchor-cli
          path: ~/.cargo/bin/anchor
          retention-days: 1
          if-no-files-found: error

  # Rust-only test templates: `--javascript` and `--package-manager` don't
  # apply, so the matrix is just template x test-template (2 x 3 = 6 cells).
  template-rust-tests:
    name: ${{ matrix.template }} + ${{ matrix.test_template }}
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-bump/')
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template: [single, multiple]
        test_template: [rust, mollusk, litesvm]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup/
      - uses: ./.github/actions/setup-cargo-cache/
      - uses: ./.github/actions/setup-solana/
        with:
          cache-save: false
      - uses: ./.github/actions/setup-surfpool/
        with:
          cache-save: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: anchor-cli
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/anchor

      # Pre-install so concurrent `cargo build-sbf` invocations don't race on
      # the platform-tools extract-then-rename. Retry on transient
      # `Failed to parse Github response` from the platform-tools release API.
      - uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        with:
          retry_wait_seconds: 60
          timeout_minutes: 5
          max_attempts: 5
          retry_on: error
          shell: bash
          command: cargo build-sbf --tools-version "${{ env.SBF_TOOLS_VERSION }}" --install-only

      # Reuse dependencies across commits; Cargo rebuilds changed checkout sources.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: template-target
        with:
          path: /tmp/my_program/target/
          key: template-target-${{ runner.os }}-${{ runner.arch }}-${{ needs.build-cli.outputs.rust-version }}-${{ env.SOLANA_VERSION }}-${{ env.SBF_TOOLS_VERSION }}-${{ matrix.template }}-${{ matrix.test_template }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'VERSION', 'cli/src/template.rs', 'cli/templates/**') }}
          restore-keys: template-target-${{ runner.os }}-${{ runner.arch }}-${{ needs.build-cli.outputs.rust-version }}-${{ env.SOLANA_VERSION }}-${{ env.SBF_TOOLS_VERSION }}-${{ matrix.template }}-${{ matrix.test_template }}-

      - name: anchor init
        working-directory: /tmp
        run: |
          mkdir -p my_program
          anchor init my_program \
            --template ${{ matrix.template }} \
            --test-template ${{ matrix.test_template }} \
            --no-git \
            --no-install \
            --force

      # Redirect generated v1 projects from published crates to this PR's
      # checkout so template changes are tested against local anchor-lang /
      # anchor-client sources.
      - name: Patch generated project to use PR checkout
        env:
          REPO: ${{ github.workspace }}
        run: |
          cat <<EOF >> /tmp/my_program/Cargo.toml

          [patch.crates-io]
          anchor-lang = { path = "$REPO/lang" }
          anchor-client = { path = "$REPO/client" }
          EOF

      - name: anchor test
        working-directory: /tmp/my_program
        run: anchor test

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        name: Save template target
        if: github.event_name != 'pull_request' && steps.template-target.outputs.cache-hit != 'true'
        with:
          path: /tmp/my_program/target/
          key: ${{ steps.template-target.outputs.cache-primary-key }}

  # JS-based test templates: cross-product over template x language x
  # package manager (2 x 2 x 2 x 4 = 32 cells).
  template-js-tests:
    name: ${{ matrix.template }} + ${{ matrix.test_template }} + ${{ matrix.language }} + ${{ matrix.package_manager }}
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-bump/')
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template: [single, multiple]
        test_template: [mocha, jest]
        language: [typescript, javascript]
        package_manager: [npm, yarn, pnpm, bun]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup/
      - uses: ./.github/actions/setup-cargo-cache/
      - uses: ./.github/actions/setup-solana/
        with:
          cache-save: false
      - uses: ./.github/actions/setup-surfpool/
        with:
          cache-save: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Each PM gets its own setup. Corepack's shim approach didn't work
      # reliably without a `packageManager` field in package.json, and
      # ubuntu-latest only ships yarn classic pre-installed.
      #   - npm: bundled with Node (no setup needed)
      #   - yarn: pre-installed on ubuntu-latest as yarn classic
      #   - pnpm: pnpm/action-setup adds the binary to PATH
      #   - bun:  oven-sh/setup-bun does the same
      - if: matrix.package_manager == 'pnpm'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
      - if: matrix.package_manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: anchor-cli
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/anchor

      # Retry on transient `Failed to parse Github response` from the
      # platform-tools release API (same flake as the matching step above).
      - uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        with:
          retry_wait_seconds: 60
          timeout_minutes: 5
          max_attempts: 5
          retry_on: error
          shell: bash
          command: cargo build-sbf --tools-version "${{ env.SBF_TOOLS_VERSION }}" --install-only

      # Dependency inputs, rather than the commit SHA, determine cache generations.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: template-target
        with:
          path: /tmp/my_program/target/
          key: template-target-${{ runner.os }}-${{ runner.arch }}-${{ needs.build-cli.outputs.rust-version }}-${{ env.SOLANA_VERSION }}-${{ env.SBF_TOOLS_VERSION }}-${{ matrix.template }}-${{ matrix.test_template }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'VERSION', 'cli/src/template.rs', 'cli/templates/**') }}
          restore-keys: template-target-${{ runner.os }}-${{ runner.arch }}-${{ needs.build-cli.outputs.rust-version }}-${{ env.SOLANA_VERSION }}-${{ env.SBF_TOOLS_VERSION }}-${{ matrix.template }}-${{ matrix.test_template }}-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: template-nm
        with:
          path: /tmp/my_program/node_modules/
          key: template-nm-${{ runner.os }}-${{ runner.arch }}-${{ env.NODE_VERSION }}-${{ matrix.test_template }}-${{ matrix.language }}-${{ matrix.package_manager }}-${{ hashFiles('VERSION', 'cli/src/template.rs') }}
          restore-keys: template-nm-${{ runner.os }}-${{ runner.arch }}-${{ env.NODE_VERSION }}-${{ matrix.test_template }}-${{ matrix.language }}-${{ matrix.package_manager }}-

      - name: anchor init
        working-directory: /tmp
        run: |
          mkdir -p my_program
          anchor init my_program \
            --template ${{ matrix.template }} \
            --test-template ${{ matrix.test_template }} \
            --package-manager ${{ matrix.package_manager }} \
            ${{ matrix.language == 'javascript' && '--javascript' || '' }} \
            --no-git \
            --force

      # Redirect generated v1 projects from published crates to this PR's
      # checkout. JS templates only need the program crate patch; the JS
      # client package is installed through the selected package manager.
      - name: Patch generated project to use PR checkout
        env:
          REPO: ${{ github.workspace }}
        run: |
          cat <<EOF >> /tmp/my_program/Cargo.toml

          [patch.crates-io]
          anchor-lang = { path = "$REPO/lang" }
          anchor-client = { path = "$REPO/client" }
          EOF

      - name: anchor test
        working-directory: /tmp/my_program
        run: anchor test

      # One writer per target key shared by the eight JS combinations.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        name: Save template target
        if: github.event_name != 'pull_request' && matrix.language == 'typescript' && matrix.package_manager == 'npm' && steps.template-target.outputs.cache-hit != 'true'
        with:
          path: /tmp/my_program/target/
          key: ${{ steps.template-target.outputs.cache-primary-key }}

      # Both layouts use the same Node dependencies.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        name: Save template node_modules
        if: github.event_name != 'pull_request' && matrix.template == 'single' && steps.template-nm.outputs.cache-hit != 'true'
        with:
          path: /tmp/my_program/node_modules/
          key: ${{ steps.template-nm.outputs.cache-primary-key }}
