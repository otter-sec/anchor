name: Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      # Docs/changelog cannot affect these tests.
      - "docs/**"
      - "docs-v2/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".cspell-anchor-dictionary.txt"
  pull_request:
    branches:
      - master
      - anchor-next
    paths-ignore:
      - "docs/**"
      - "docs-v2/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".cspell-anchor-dictionary.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Reusable
    uses: ./.github/workflows/reusable-tests.yaml
    with:
      cache: true
      solana_version: 4.1.2
      node_version: 22.22.3
      cargo_profile: debug
      anchor_binary_name: anchor-binary
      surfpool_cli_version: 1.5.0
