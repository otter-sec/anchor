name: No Caching Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      # Docs/changelog cannot affect these tests.
      - "docs/**"
      - "docs-v2/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".cspell-anchor-dictionary.txt"

permissions:
  contents: read

jobs:
  no-caching-tests:
    name: Reusable
    uses: ./.github/workflows/reusable-tests.yaml
    with:
      cache: false
      solana_version: 4.1.2
      node_version: 22.22.3
      cargo_profile: release
      anchor_binary_name: anchor-binary-no-caching
      surfpool_cli_version: 1.5.0
