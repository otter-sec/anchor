name: No Caching Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'

jobs:
  no-caching-tests:
    name: Reusable
    uses: ./.github/workflows/reusable-tests.yaml
    with:
      cache: false
      # Older Agave releases reject the ELF layout emitted by the SBPF v3 backport.
      # The CLI still selects platform-tools v1.51.1 for program compilation.
      solana_cli_version: 4.1.2
      node_version: 20.18.0
      cargo_profile: release
      anchor_binary_name: anchor-binary-no-caching
