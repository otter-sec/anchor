name: "Setup ts"
description: "Setup ts"
inputs:
  cache-save:
    description: "Allow this job to save the cache"
    default: "true"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
      with:
        node-version: ${{ env.NODE_VERSION }}
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.cache-save == 'true'
      name: Cache Typescript node_modules
      id: cache-typescript-node-modules
      with:
        path: |
          ./ts/node_modules/
        key: solana-${{ runner.os }}-v0000-${{ env.NODE_VERSION }}-${{ hashFiles('./ts/**/yarn.lock') }}
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.cache-save != 'true'
      name: Restore Typescript node_modules
      id: restore-typescript-node-modules
      with:
        path: |
          ./ts/node_modules/
        key: solana-${{ runner.os }}-v0000-${{ env.NODE_VERSION }}-${{ hashFiles('./ts/**/yarn.lock') }}
    - uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
      with:
        retry_wait_seconds: 60
        timeout_minutes: 5
        max_attempts: 5
        retry_on: error
        shell: bash
        command: cd ts && yarn --frozen-lockfile
    - run: cd ts/packages/borsh && yarn build && yarn link
      shell: bash
    - run: cd ts/packages/anchor-errors && yarn build && yarn link
      shell: bash
    - run: cd ts/packages/anchor && yarn build:node && yarn link
      shell: bash
    - run: cd ts/packages/spl-associated-token-account && yarn build:node && yarn link
      shell: bash
    - run: cd ts/packages/spl-token && yarn build:node && yarn link
      shell: bash
    - run: cd examples/tutorial && yarn link @anchor-lang/core @anchor-lang/borsh
      shell: bash
    - uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
      with:
        retry_wait_seconds: 60
        timeout_minutes: 5
        max_attempts: 5
        retry_on: error
        shell: bash
        command: cd examples/tutorial && yarn --frozen-lockfile
    - run: cd tests && yarn link @anchor-lang/core @anchor-lang/borsh @anchor-lang/spl-associated-token-account @anchor-lang/spl-token
      shell: bash
    - uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
      with:
        retry_wait_seconds: 60
        timeout_minutes: 5
        max_attempts: 5
        retry_on: error
        shell: bash
        command: cd tests && yarn --frozen-lockfile
