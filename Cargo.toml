[workspace]
members = [
    "avm",
    "cli",
    "cli/cli-macros",
    "client",
    "idl",
    "lang",
    "lang/attribute/*",
    "lang/derive/*",
    "lang/error",
    "lang/syn",
    "spl",
]
exclude = ["tests/cfo/deps/openbook-dex", "tests/swap/deps/openbook-dex"]
resolver = "2"

[workspace.package]
version = "1.2.0"
readme = "README.md"
repository = "https://github.com/otter-sec/anchor"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.dependencies]
# Anchor supports two curated Solana dependency sets, selected by the
# mutually-exclusive `v3`/`v4` features with `v3` being the default.
#
# Crates whose resolved major is the same in both cohorts are declared once
# under "shared" below. 

# --- shared by both cohorts ---
solana-account-info = "3.1.0"
solana-commitment-config = "3.1.1"
solana-compute-budget-interface = "3.0.0"
solana-cpi = "3.0.0"
solana-faucet = "3.1.14"
solana-instruction = "3.5"
solana-invoke = "0.5.0"
solana-keypair = "3.0.1"
solana-msg = "3.1.0"
solana-program = "4.1.0" # must be kept in sync with `cli/solana-program-version`
solana-program-entrypoint = "3.1.1"
solana-program-error = "3.0.0"
solana-program-memory = "3.1.0"
solana-program-option = "3.0.1"
solana-program-pack = "3.1.0"
solana-sdk-ids = "3.1.0"
solana-signature = "3.3.0"
solana-signer = "3.0.0"
solana-system-interface = "3.2.0"
solana-sysvar-id = "3.1.0"

# --- v3 cohort (default) ---
solana-account-decoder-v3 = { package = "solana-account-decoder", version = "3.0.14" }
solana-cli-config-v3 = { package = "solana-cli-config", version = "3.0.14" }
solana-client-v3 = { package = "solana-client", version = "3.0.14" }
solana-clock-v3 = { package = "solana-clock", version = "3.0.1" }
solana-compute-budget-v3 = { package = "solana-compute-budget", version = "3.1.10", features = ["agave-unstable-api"] }
solana-define-syscall-v3 = { package = "solana-define-syscall", version = "3.0.0" }
solana-feature-gate-interface-v3 = { package = "solana-feature-gate-interface", version = "3.0.0" }
solana-hash-v3 = { package = "solana-hash", version = "3.1.0" }
solana-instructions-sysvar-v3 = { package = "solana-instructions-sysvar", version = "3.0.0" }
solana-loader-v3-interface-v3 = { package = "solana-loader-v3-interface", version = "6.1.1" }
solana-message-v3 = { package = "solana-message", version = "3.0.1" }
solana-packet-v3 = { package = "solana-packet", version = "3.0.0" }
solana-pubkey-v3 = { package = "solana-pubkey", version = "3.0.0" }
solana-pubsub-client-v3 = { package = "solana-pubsub-client", version = "3.0.14" }
solana-rpc-client-v3 = { package = "solana-rpc-client", version = "3.0.14" }
solana-rpc-client-api-v3 = { package = "solana-rpc-client-api", version = "3.0.14" }
solana-sbpf-v3 = { package = "solana-sbpf", version = "0.23.0" }
solana-stake-interface-v3 = { package = "solana-stake-interface", version = "2.0.2" }
solana-sysvar-v3 = { package = "solana-sysvar", version = "3.1.1" }
solana-transaction-v3 = { package = "solana-transaction", version = "3.0.1" }
solana-transaction-status-client-types-v3 = { package = "solana-transaction-status-client-types", version = "3.0.0" }

# --- v4 cohort (Agave 4.3) ---
solana-account-decoder-v4 = { package = "solana-account-decoder", version = "4.3.0" }
solana-cli-config-v4 = { package = "solana-cli-config", version = "4.3.0" }
solana-client-v4 = { package = "solana-client", version = "4.3.0" }
solana-clock-v4 = { package = "solana-clock", version = "4.0.0" }
solana-compute-budget-v4 = { package = "solana-compute-budget", version = "4.3.0", features = ["agave-unstable-api"] }
solana-define-syscall-v4 = { package = "solana-define-syscall", version = "4.0.1" }
solana-feature-gate-interface-v4 = { package = "solana-feature-gate-interface", version = "4.0.0" }
solana-hash-v4 = { package = "solana-hash", version = "4.7.0" }
solana-instructions-sysvar-v4 = { package = "solana-instructions-sysvar", version = "4.0.0" }
solana-loader-v3-interface-v4 = { package = "solana-loader-v3-interface", version = "7.0.0" }
solana-message-v4 = { package = "solana-message", version = "4.6.0" }
solana-packet-v4 = { package = "solana-packet", version = "4.4.0" }
solana-pubkey-v4 = { package = "solana-pubkey", version = "4.4.0" }
solana-pubsub-client-v4 = { package = "solana-pubsub-client", version = "4.3.0" }
solana-rpc-client-v4 = { package = "solana-rpc-client", version = "4.3.0" }
solana-rpc-client-api-v4 = { package = "solana-rpc-client-api", version = "4.3.0" }
solana-sbpf-v4 = { package = "solana-sbpf", version = "0.23.0" }
solana-stake-interface-v4 = { package = "solana-stake-interface", version = "4.4.0" }
solana-sysvar-v4 = { package = "solana-sysvar", version = "4.3.0" }
solana-transaction-v4 = { package = "solana-transaction", version = "4.3.0", features = ["wincode"] }
solana-transaction-status-client-types-v4 = { package = "solana-transaction-status-client-types", version = "4.3.0" }

# Non solana crates
cargo_toml = "0.22.3"
heck = "0.5"
# Solana crates currently use 0.12, make sure to bump this to 0.13
# when they do to avoid duplicate deps
reqwest = { version = "0.12.28", default-features = false }
syn = "2"

# Internal anchor crates
# `default-features = false` on the cohort-aware crates: each workspace member
# selects `v3`/`v4` explicitly through its own feature of the same name, so
# inheriting anchor-lang's default cohort here would pin every member to `v3`
# and make `v3` and `v4` collide in a `--features v4` build.
anchor-lang = { path = "lang", version = "=1.2.0", default-features = false }
anchor-spl = { path = "spl", version = "=1.2.0", default-features = false }
anchor-client = { path = "client", version = "=1.2.0", default-features = false }
anchor-syn = { path = "lang/syn", version = "=1.2.0" }
anchor-lang-error = { path = "lang/error", version = "=1.2.0", default-features = false }
anchor-attribute-access-control = { path = "lang/attribute/access-control", version = "=1.2.0" }
anchor-attribute-account = { path = "lang/attribute/account", version = "=1.2.0" }
anchor-attribute-constant = { path = "lang/attribute/constant", version = "=1.2.0" }
anchor-attribute-error = { path = "lang/attribute/error", version = "=1.2.0" }
anchor-attribute-event = { path = "lang/attribute/event", version = "=1.2.0" }
anchor-attribute-program = { path = "lang/attribute/program", version = "=1.2.0" }
anchor-derive-accounts = { path = "lang/derive/accounts", version = "=1.2.0" }
# `default-features = false`: this crate carries a `v3` default for its own
# doc tests, which must not feed back into anchor-lang's cohort selection.
anchor-derive-serde = { path = "lang/derive/serde", version = "=1.2.0", default-features = false }
anchor-derive-space = { path = "lang/derive/space", version = "=1.2.0" }
anchor-cli-macros = { path = "cli/cli-macros", version = "=1.2.0" }
anchor-lang-idl = { path = "idl", version = "=0.1.4" }
anchor-lang-idl-spec = { path = "idl/spec", version = "=0.1.0" }

[profile.release]
lto = true

[profile.release.package.anchor-cli]
codegen-units = 1
