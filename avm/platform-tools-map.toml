# Static map from Solana release → corresponding `platform-tools` version.
#
# Source of truth: `DEFAULT_PLATFORM_TOOLS_VERSION` (or its predecessors, the
# `platform_tools_version` / `sbf_tools_version` literals) in cargo-build-sbf:
#
#   1.14.x – 1.18.x : solana-labs/solana, sdk/cargo-build-sbf/src/main.rs
#   2.0.x – 2.3.x : anza-xyz/agave, sdk/cargo-build-sbf/src/main.rs
#                   (then platform-tools-sdk/cargo-build-sbf/src/main.rs from 2.2)
#   3.0.x+ : anza-xyz/agave, platform-tools-sdk/cargo-build-sbf/src/toolchain.rs
#
# The mapped releases must support SBPF arch v3. Where the release-native tools
# predate v3, use the compatible v3 backport that retains the same Rust minor:
# v1.42.1 (Rust 1.75), v1.46.1 (Rust 1.79), or v1.51.1 (Rust 1.84.1).
# v1.57 and later support v3 directly.
#
# Resolution: given a requested Solana version `S`, pick the entry with the
# largest `solana` key that is `<= S`. Entries MUST be ordered by `solana` so
# the resolver can stop at the first key that exceeds the request.
#
# `rustc` is the Rust compiler bundled in the corresponding platform-tools
# release. Source of truth: `src/version` in solana-labs/rust or anza-xyz/rust
# on the tool release's tag or `solana-tools-<platform_tools>` branch.
#
# `cargo_lock_v4` records whether the bundled Cargo rejects lockfile v4
# (`unsupported`), accepts it only with `-Znext-lockfile-bump` (`opt-in`), or
# accepts it without an unstable opt-in (`native`).
#
# `fallback` is used when the project does not pin a Solana version at all.
# Keep it equal to the platform-tools version of the newest entry below.

fallback = "v1.57"

[[entries]]
solana = "1.14.16"
platform_tools = "v1.42.1"
rustc = "1.75.0"
cargo_lock_v4 = "opt-in"

[[entries]]
solana = "1.15.0"
platform_tools = "v1.42.1"
rustc = "1.75.0"
cargo_lock_v4 = "opt-in"

[[entries]]
solana = "1.16.0"
platform_tools = "v1.42.1"
rustc = "1.75.0"
cargo_lock_v4 = "opt-in"

[[entries]]
solana = "1.18.0"
platform_tools = "v1.42.1"
rustc = "1.75.0"
cargo_lock_v4 = "opt-in"

[[entries]]
solana = "1.18.8"
platform_tools = "v1.42.1"
rustc = "1.75.0"
cargo_lock_v4 = "opt-in"

[[entries]]
solana = "2.0.5"
platform_tools = "v1.42.1"
rustc = "1.75.0"
cargo_lock_v4 = "opt-in"

[[entries]]
solana = "2.1.0"
platform_tools = "v1.46.1"
rustc = "1.79.0"
cargo_lock_v4 = "native"

[[entries]]
solana = "2.2.1"
platform_tools = "v1.46.1"
rustc = "1.79.0"
cargo_lock_v4 = "native"

[[entries]]
solana = "2.2.3"
platform_tools = "v1.46.1"
