[package]
name = "example"
version = "0.1.0"
authors = ["Armani Ferrante <armaniferrante@gmail.com>"]
edition = "2021"

[workspace]

[features]
async = ["anchor-client/async"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-client = { path = "../", features = ["debug"] }
anchor-lang = { path = "../../lang-v2" }
anyhow = "1.0.32"
clap = { version = "4.2.4", features = ["derive"] }
shellexpand = "2.1.0"
solana-sdk = "4.0.1"
solana-system-interface = "3.3.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
anchor-lang-v1 = { path = "../../lang" }
legacy-basic-2 = { package = "basic-2", path = "../../examples/tutorial/basic-2/programs/basic-2", features = ["no-entrypoint"] }
legacy-composite = { package = "composite", path = "../../tests/composite/programs/composite", features = ["no-entrypoint"] }
legacy-events = { package = "events", path = "../../tests/events/programs/events", features = ["no-entrypoint"] }
